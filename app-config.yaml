# Example configuration specific to this dynamic plugin example
app:
  title: Dynamic Plugins Custom Mount Point Example
  baseUrl: http://localhost:7007

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

backend:
  baseUrl: http://localhost:7007
  database:
    client: better-sqlite3
    connection: ':memory:'
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    upgrade-insecure-requests: false
  cors:
    origin: ${BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  auth:
    keys:
      - secret: bleb
      
dynamicPlugins:
  rootDirectory: dynamic-plugins-root
  frontend:
    dynamic-plugins-examples.backstage-plugin-custom-mount-point-host:
      dynamicRoutes:
        - path: /custom-mount-point
          importName: CustomMountPointHostPage
          menuItem:
            icon: star
            text: Example Mount Point
    dynamic-plugins-examples.backstage-plugin-simple-test-card-green:
      mountPoints:
        - mountPoint: custom.mount.point
          importName: SimpleTestCardGreen
    dynamic-plugins-examples.backstage-plugin-simple-test-card-blue:
      mountPoints:
        - mountPoint: custom.mount.point
          importName: SimpleTestCardBlue
